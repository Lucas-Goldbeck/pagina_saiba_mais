server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

  error_page 404 /404.html;

  location = /solucoes { try_files /solucoes.html =404; }
  location = /notasync { try_files /notasync.html =404; }
  location = /gcont-ia { try_files /gcont-ia.html =404; }
  location = /sobre { try_files /sobre.html =404; }
  location = /contato { try_files /contato.html =404; }
  location = /privacidade { try_files /privacidade.html =404; }
  location = /termos { try_files /termos.html =404; }
  location ~ ^/(solucoes|notasync|gcont-ia|sobre|contato|privacidade|termos)/$ { return 301 /$1; }

  location = /loja { try_files /sistemas.html =404; }
  location = /loja/ { try_files /sistemas.html =404; }

  location = /sistemas {
    try_files /sistemas.html =404;
  }

  location = /sistemas/ {
    try_files /sistemas.html =404;
  }

  location ^~ /sistemas/ {
    try_files $uri /sistemas.html;
  }

  location / { try_files $uri $uri/ =404; }

  location ~* \.(?:css|js)$ {
    expires -1;
    access_log off;
  }

  location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|mp4)$ {
    expires 7d;
    access_log off;
  }

  location = /404.html { internal; }
}
