server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /sistemas {
    try_files /sistemas.html =404;
  }

  location = /sistemas/ {
    try_files /sistemas.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|mp4)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    access_log off;
  }
}
